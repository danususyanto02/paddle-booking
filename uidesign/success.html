<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Confirmed — Kinetic Court</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/globals.css" />
</head>
<body>
  <div data-navbar></div>
  <main class="max-w-[720px] mx-auto px-4 md:px-12 py-12 text-center">
    <div class="w-16 h-16 rounded-full bg-mint-glace text-primary grid place-items-center mx-auto"><span class="material-symbols-outlined text-[32px]">check_circle</span></div>
    <h1 class="text-3xl font-bold mt-4">Booking Confirmed!</h1>
    <p class="text-sm text-on-surface-variant mt-2">Your payment was processed (mock). Show this e-ticket at the venue.</p>

    <div id="ticket" class="mt-8 text-left bg-surface-container-lowest border border-surface-variant rounded-xl p-6 card-shadow"></div>

    <div class="mt-6 flex justify-center gap-3">
      <a href="/dashboard.html" class="px-6 py-3 rounded-full bg-primary text-on-primary text-sm font-semibold hover:opacity-90">Go to Dashboard</a>
      <a href="/courts.html" class="px-6 py-3 rounded-full border border-outline-variant text-sm font-semibold hover:bg-surface-variant">Book Another Court</a>
    </div>
  </main>
  <div data-footer></div>
  <script type="module">
    import { renderNavbar, bindNavbar } from '/src/js/components/navbar.js'
    import { renderFooter } from '/src/js/components/footer.js'
    import { getBookings } from '/src/js/stores/bookingStore.js'
    import { getCourt } from '/src/js/data/courts.js'
    import { formatIDRShort } from '/src/js/lib/pricing.js'
    import { clearSelection } from '/src/js/stores/bookingStore.js'

    document.querySelector('[data-navbar]').innerHTML=renderNavbar('')
    document.querySelector('[data-footer]').innerHTML=renderFooter()
    bindNavbar()

    const code=new URLSearchParams(location.search).get('code')
    const booking=getBookings().find(b=> b.id===code) || getBookings()[0]
    const court=getCourt(booking?.courtId)
    const ticket=document.getElementById('ticket')
    if(!booking || !court){
      ticket.innerHTML=`<p class="text-sm text-secondary">No booking found.</p>`
    } else {
      ticket.innerHTML=`
        <div class="flex justify-between items-start">
          <div>
            <div class="text-xs font-semibold tracking-widest text-secondary">E-TICKET</div>
            <div class="font-mono text-lg font-bold mt-1">${booking.id}</div>
            <div class="text-xs text-secondary mt-1">Status: <span class="font-semibold text-primary">${booking.status}</span> · ${booking.paymentMethod||'Mock'}</div>
          </div>
          <div class="text-right">
            <div class="text-sm font-semibold">${court.name}</div>
            <div class="text-xs text-secondary">${court.location}</div>
          </div>
        </div>
        <div class="h-px bg-outline-variant/30 my-4"></div>
        <div class="grid grid-cols-2 gap-4 text-sm">
          <div><div class="text-xs text-secondary">Date</div><div class="font-medium">${new Date(booking.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long', year:'numeric', month:'long', day:'numeric'})}</div></div>
          <div><div class="text-xs text-secondary">Time</div><div class="font-medium">${booking.start} – ${booking.end} · ${booking.duration} min</div></div>
          <div><div class="text-xs text-secondary">Court</div><div class="font-medium">${court.type} · ${court.surface}</div></div>
          <div><div class="text-xs text-secondary">Total Paid</div><div class="font-semibold text-primary">${formatIDRShort(booking.total)}</div></div>
        </div>
        <div class="mt-4 p-3 rounded-lg bg-mint-glace text-xs text-on-primary-fixed-variant">Free cancellation up to 24 hours before your slot. Present this code at check-in.</div>
      `
      clearSelection()
    }
  </script>
</body>
</html>
